<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>閲覧できる申請 | Sample SaaS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial;}
body{min-height:100vh;background:linear-gradient(135deg,#f5f9ff,#ffffff);color:#1a1a1a;display:flex;align-items:center;justify-content:center;padding:40px;}
.card{max-width:760px;width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:24px;box-shadow:0 20px 60px rgba(15,23,42,0.08);padding:48px;}
.eyebrow{color:#2b6df6;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;}
h1{font-size:40px;margin-bottom:16px;}
p{font-size:16px;line-height:1.8;color:#4b5563;margin-bottom:28px;}
.actions{display:flex;gap:12px;flex-wrap:wrap;}
.btn{display:inline-block;text-decoration:none;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:700;}
.primary{background:#2b6df6;color:#fff;}
.secondary{background:#eef2ff;color:#1d4ed8;}
</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Workflow</div>
    <h1>閲覧できる申請</h1>
    <p>自分に閲覧権限がある申請の一覧ページです。部署横断の閲覧や監査確認に使えます。</p>
    <div class="actions">
      <a class="btn primary" href="index.html">ダッシュボードへ戻る</a>
      <a class="btn secondary" href="signup.html">無料で試す</a>
    </div>
  </main>
</body>
</html>
