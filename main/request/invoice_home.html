<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>請求書ホーム | Sample SaaS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial;}
body{min-height:100vh;background:linear-gradient(135deg,#f5f9ff,#ffffff);color:#1a1a1a;display:flex;align-items:center;justify-content:center;padding:40px 40px 40px 300px;}
.sidebar{position:fixed;top:0;left:0;width:260px;height:100vh;background:#1f2937;color:#fff;padding:20px;overflow:auto;}
.sidebar .logo{font-size:20px;margin-bottom:30px;color:#fff;}
.menu{list-style:none;padding:0;}
.menu a{display:block;color:#fff;text-decoration:none;padding:12px 10px;margin-bottom:8px;border-radius:6px;}
.menu a:hover{background:#374151;}
.card{max-width:1080px;width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:24px;box-shadow:0 20px 60px rgba(15,23,42,0.08);padding:48px;}
.eyebrow{color:#2b6df6;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;}
h1{font-size:40px;margin-bottom:12px;}
.lead{font-size:16px;line-height:1.8;color:#4b5563;margin-bottom:28px;}
.table-wrap{overflow:auto;border:1px solid #e5e7eb;border-radius:16px;}
table{width:100%;border-collapse:collapse;min-width:780px;}
th,td{padding:16px 18px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:14px;}
th{background:#f8fafc;color:#374151;font-weight:700;}
tr:last-child td{border-bottom:none;}
.status{display:inline-block;padding:6px 10px;border-radius:999px;background:#ecfeff;color:#155e75;font-weight:700;font-size:12px;}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;}
.btn{display:inline-block;text-decoration:none;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:700;}
.primary{background:#2b6df6;color:#fff;}
.secondary{background:#eef2ff;color:#1d4ed8;}
.ghost{background:#f3f4f6;color:#374151;}
.empty-state{padding:28px;border:1px dashed #cbd5e1;border-radius:16px;background:#f8fafc;color:#475569;text-align:center;}
.case-link{color:#1d4ed8;text-decoration:none;font-weight:700;}
</style>
</head>
<body>
  <aside class="sidebar">
    <h2 class="logo">SampleSaaS</h2>
    <ul class="menu">
      <li><a href="../apply.html">申請する</a></li>
      <li><a href="../proxy-apply.html">代理申請する</a></li>
      <li><a href="../my-applications.html">自分の申請</a></li>
      <li><a href="../approvals.html">承認する</a></li>
      <li><a href="../proxy-approvals.html">代理承認する</a></li>
      <li><a href="../viewable-applications.html">閲覧できる申請</a></li>
      <li><a href="../invoices.html">回収した請求書</a></li>
      <li><a href="../all-applications.html">すべての申請</a></li>
      <li><a href="../routes-forms.html">経路・フォーム</a></li>
      <li><a href="../admin-settings.html">管理者設定</a></li>
      <li><a href="../accounting-features.html">経理機能</a></li>
    </ul>
  </aside>

  <main class="card">
    <div class="eyebrow">Request</div>
    <h1>請求書ホーム</h1>
    <p class="lead">案件ごとに会社名・期限・金額を一覧で確認して、対象案件の請求書作成に進む画面です。</p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>会社</th>
            <th>請求期限</th>
            <th>金額</th>
            <th>状態</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="invoice-list"></tbody>
      </table>
    </div>

    <div class="empty-state" id="empty-state" hidden>
      まだ請求書データがありません。`invoice.html` から保存すると、ここに一覧が表示されます。
    </div>

    <div class="actions">
      <a class="btn primary" href="invoice.html">新規請求書を作る</a>
      <a class="btn secondary" href="../apply.html">申請するへ戻る</a>
    </div>
  </main>

  <script type="module">
    import { collection, db, getDocs, orderBy, query } from './firebase.js';

    const list = document.getElementById('invoice-list');
    const emptyState = document.getElementById('empty-state');

    const formatAmount = (value) => {
      const numeric = Number(String(value).replace(/[^\d.-]/g, ''));
      if (Number.isNaN(numeric) || numeric === 0) {
        return value || '-';
      }
      return `¥${numeric.toLocaleString('ja-JP')}`;
    };

    const formatDate = (value) => {
      if (!value) return '-';
      return String(value).replaceAll('-', '/');
    };

    const renderRows = (rows) => {
      list.innerHTML = '';

      if (rows.length === 0) {
        emptyState.hidden = false;
        list.innerHTML = '<tr><td colspan="5" style="padding:24px;text-align:center;color:#64748b;">まだ保存された請求書はありません。</td></tr>';
        return;
      }

      emptyState.hidden = true;

      rows.forEach((item) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><a class="case-link" href="invoice.html?docId=${item.id}">${item.company || '-'}</a></td>
          <td>${formatDate(item.dueDate)}</td>
          <td>${formatAmount(item.amount)}</td>
          <td><span class="status">${item.status || '保存済み'}</span></td>
          <td><a class="btn primary" href="invoice.html?docId=${item.id}">請求書を作る</a></td>
        `;
        list.appendChild(tr);
      });
    };

    try {
      const snapshot = await getDocs(query(collection(db, 'invoices'), orderBy('createdAt', 'desc')));
      const rows = snapshot.docs.map((invoiceDoc) => ({ id: invoiceDoc.id, ...invoiceDoc.data() }));
      renderRows(rows);
    } catch (error) {
      emptyState.hidden = false;
      list.innerHTML = '<tr><td colspan="5" style="padding:24px;text-align:center;color:#b91c1c;">請求書一覧を読み込めませんでした。</td></tr>';
      console.error(error);
    }
  </script>
</body>
</html>
